[package]
name = "efivars-sys"
version = "0.1.0"
edition = "2024"

[dependencies]
efivars-core = { version = "0.1.0", path = "../efivars-core" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }
